version: '3.9'

services:

  # ── Passenger Web ─────────────────────────────────────────────────────────
  web:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.web
      args:
        APP: web
        PORT: 3000
    container_name: buslanka-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:3001/v1/ws
    ports:
      - "3000:3000"

  # ── Operator Portal ───────────────────────────────────────────────────────
  operator-portal:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.web
      args:
        APP: operator-portal
        PORT: 3002
    container_name: buslanka-operator-portal
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/v1
    ports:
      - "3002:3002"

  # ── Admin Portal ──────────────────────────────────────────────────────────
  admin-portal:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.web
      args:
        APP: admin-portal
        PORT: 3003
    container_name: buslanka-admin-portal
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/v1
    ports:
      - "3003:3003"
