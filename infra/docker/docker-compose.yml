version: '3.9'

services:

  # ── PostgreSQL + PostGIS ──────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: buslanka-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: buslanka_dev
      POSTGRES_USER: buslanka
      POSTGRES_PASSWORD: changeme_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buslanka -d buslanka_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: buslanka-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (S3-compatible object storage) ──────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: buslanka-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── NestJS API ────────────────────────────────────────────────────────────
  api:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.api
    container_name: buslanka-api
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      DATABASE_HOST: postgres
      REDIS_HOST: redis
      STORAGE_ENDPOINT: http://minio:9000
      NODE_ENV: development
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../services/api/src:/app/services/api/src:ro
      - ../../packages:/app/packages:ro

  # ── Passenger Web ─────────────────────────────────────────────────────────
  web:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.web
      args:
        APP: web
        PORT: 3000
    container_name: buslanka-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:3001/v1/ws
    ports:
      - "3000:3000"
    depends_on:
      - api

  # ── Operator Portal ───────────────────────────────────────────────────────
  operator-portal:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.web
      args:
        APP: operator-portal
        PORT: 3002
    container_name: buslanka-operator-portal
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/v1
    ports:
      - "3002:3002"
    depends_on:
      - api

  # ── Admin Portal ──────────────────────────────────────────────────────────
  admin-portal:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.web
      args:
        APP: admin-portal
        PORT: 3003
    container_name: buslanka-admin-portal
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/v1
    ports:
      - "3003:3003"
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
  minio-data:
